info:
  contact: {}
  description: Watt Backend API in Go
  title: Watt API
  version: "1.0"
paths:
  /admin/categories:
    get:
      description: Retrieves all global categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/watt_internal_response.APIResponse'
            - properties:
                body:
                  items:
                    $ref: '#/definitions/watt_internal_models.GlobalCategoryOut'
                  type: array
              type: object
      security:
      - Bearer: []
      summary: Get all categories
      tags:
      - Admin API
    post:
      consumes:
      - multipart/form-data
      description: Creates a new global category with optional icon
      parameters:
      - description: Category name
        in: formData
        name: name
        required: true
        type: string
      - description: Category icon
        in: formData
        name: icon
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/watt_internal_response.APIResponse'
            - properties:
                body:
                  $ref: '#/definitions/watt_internal_models.GlobalCategoryOut'
              type: object
      security:
      - Bearer: []
      summary: Create a category
      tags:
      - Admin API
  /admin/categories/{id}:
    delete:
      description: Deletes an existing global category by ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/watt_internal_response.APIResponse'
      security:
      - Bearer: []
      summary: Delete a category
      tags:
      - Admin API
    put:
      consumes:
      - multipart/form-data
      description: Updates an existing global category by ID with optional icon
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Category name
        in: formData
        name: name
        type: string
      - description: Category icon
        in: formData
        name: icon
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/watt_internal_response.APIResponse'
            - properties:
                body:
                  $ref: '#/definitions/watt_internal_models.GlobalCategoryOut'
              type: object
      security:
      - Bearer: []
      summary: Update a category
      tags:
      - Admin API
  /admin/cities:
    get:
      description: Retrieves all cities, optionally filtered by country_id
      parameters:
      - description: Filter by Country ID
        in: query
        name: country_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/watt_internal_response.APIResponse'
            - properties:
                body:
                  items:
                    $ref: '#/definitions/watt_internal_models.CityOut'
                  type: array
              type: object
      security:
      - Bearer: []
      summary: Get all cities
      tags:
      - Admin API
    post:
      consumes:
      - application/json
      description: Creates a new city
      parameters:
      - description: City data
        in: body
        name: city
        required: true
        schema:
          $ref: '#/definitions/watt_internal_models.CitySchema'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/watt_internal_response.APIResponse'
            - properties:
                body:
                  $ref: '#/definitions/watt_internal_models.CityOut'
              type: object
      security:
      - Bearer: []
      summary: Create a city
      tags:
      - Admin API
  /admin/companies:
    get:
      consumes:
      - application/json
      description: AdminListCompanies
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 12
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Status filter
        in: query
        name: status
        type: string
      - description: Search
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/watt_internal_response.APIResponse'
      security:
      - Bearer: []
      summary: AdminListCompanies
      tags:
      - Admin Companies API
  /admin/companies/{company_id}:
    get:
      description: Get company details for admin
      parameters:
      - description: company_id
        in: path
        name: company_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/watt_internal_response.APIResponse'
      security:
      - Bearer: []
      summary: AdminGetCompany
      tags:
      - Admin Companies API
  /admin/companies/{company_id}/details:
    get:
      description: Get detailed company information for admin
      parameters:
      - description: company_id
        in: path
        name: company_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/watt_internal_response.APIResponse'
      security:
      - Bearer: []
      summary: AdminGetCompanyDetails
      tags:
      - Admin Companies API
  /admin/companies/{company_id}/members:
    get:
      description: Get company members for admin
      parameters:
      - description: company_id
        in: path
        name: company_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/watt_internal_response.APIResponse'
      security:
      - Bearer: []
      summary: AdminGetCompanyMembers
      tags:
      - Admin Companies API
  /admin/companies/{company_id}/posters:
    get:
      description: Get posters for a company (admin)
      parameters:
      - description: company_id
        in: path
        name: company_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/watt_internal_response.APIResponse'
      security:
      - Bearer: []
      summary: AdminGetCompanyPosters
      tags:
      - Admin Companies API
  /admin/companies/{company_id}/services:
    get:
      description: Get service catalog status for admin
      parameters:
      - description: company_id
        in: path
        name: company_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/watt_internal_response.APIResponse'
      security:
      - Bearer: []
      summary: AdminGetCompanyServices
      tags:
      - Admin Companies API
  /admin/companies/{company_id}/status:
    post:
      consumes:
      - application/json
      description: AdminUpdateCompanyStatus
      parameters:
      - description: Status Action
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/watt_internal_models.CompanyStatusActionSchema'
      - description: company_id
        in: path
        name: company_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/watt_internal_response.APIResponse'
      security:
      - Bearer: []
      summary: AdminUpdateCompanyStatus
      tags:
      - Admin Companies API
  /admin/companies/{company_id}/subscription-requests/{request_id}/review:
    post:
      consumes:
      - application/json
      description: Review a company's subscription request (active/rejected)
      parameters:
      - description: company_id
        in: path
        name: company_id
        required: true
        type: integer
      - description: request_id
        in: path
        name: request_id
        required: true
        type: integer
      - description: Review payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/watt_internal_models.CompanySubscriptionRequestReviewSchema'
      produces:
      - application/json
      responses:
        "200":
