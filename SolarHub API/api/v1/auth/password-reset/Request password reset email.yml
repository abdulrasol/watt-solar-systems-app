info:
  name: Request password reset email
  type: http
  seq: 1
  tags:
    - Auth & Users

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/password-reset"
  body:
    type: json
    data: |-
      {
        "identifier": "ali_ahmed"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    request:
      url: "{{baseUrl}}/api/v1/auth/password-reset"
      method: POST
      body:
        type: json
        data: |-
          {
            "identifier": "ali_ahmed"
          }
    response:
      status: 201
      statusText: Created
      body:
        type: text
        data: ""
