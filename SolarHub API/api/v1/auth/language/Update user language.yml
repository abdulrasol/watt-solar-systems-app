info:
  name: Update user language
  type: http
  seq: 1
  tags:
    - Auth & Users

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/auth/language"
  body:
    type: json
    data: |-
      {
        "language": "en"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/v1/auth/language"
      method: PUT
      body:
        type: json
        data: |-
          {
            "language": "en"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
