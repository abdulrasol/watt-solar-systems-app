info:
  name: Register new user
  type: http
  seq: 1
  tags:
    - Auth & Users

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register"
  body:
    type: json
    data: |-
      {
        "username": "new_user",
        "email": "user@example.com",
        "phone": "+9647701234567",
        "password": "password123",
        "first_name": "Ali",
        "last_name": "Ahmed",
        "city_id": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    request:
      url: "{{baseUrl}}/api/v1/auth/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "username": "new_user",
            "email": "user@example.com",
            "phone": "+9647701234567",
            "password": "password123",
            "first_name": "Ali",
            "last_name": "Ahmed",
            "city_id": 1
          }
    response:
      status: 201
      statusText: Created
      body:
        type: text
        data: ""
