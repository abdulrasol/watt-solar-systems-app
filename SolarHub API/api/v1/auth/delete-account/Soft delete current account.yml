info:
  name: Soft delete current account
  type: http
  seq: 1
  tags:
    - Auth & Users

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/delete-account"
  body:
    type: json
    data: |-
      {
        "password": "",
        "reason": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    request:
      url: "{{baseUrl}}/api/v1/auth/delete-account"
      method: POST
      body:
        type: json
        data: |-
          {
            "password": "",
            "reason": ""
          }
    response:
      status: 201
      statusText: Created
      body:
        type: text
        data: ""
