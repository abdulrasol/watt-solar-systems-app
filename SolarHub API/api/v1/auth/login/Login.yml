info:
  name: Login
  type: http
  seq: 1
  tags:
    - Auth & Users

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "identifier": "admin",
        "password": "1122"
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    request:
      url: "{{baseUrl}}/api/v1/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "identifier": "ali_ahmed",
            "password": "password123"
          }
    response:
      status: 201
      statusText: Created
      body:
        type: text
        data: ""
