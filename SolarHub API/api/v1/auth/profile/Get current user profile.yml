info:
  name: Get current user profile
  type: http
  seq: 1
  tags:
    - Auth & Users

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/profile"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/v1/auth/profile"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
