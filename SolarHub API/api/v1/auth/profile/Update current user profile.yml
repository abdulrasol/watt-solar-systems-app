info:
  name: Update current user profile
  type: http
  seq: 2
  tags:
    - Auth & Users

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/auth/profile"
  body:
    type: json
    data: |-
      {
        "username": "",
        "email": "",
        "phone": "",
        "first_name": "",
        "last_name": "",
        "city_id": 0,
        "security_question": "",
        "security_answer": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/v1/auth/profile"
      method: PUT
      body:
        type: json
        data: |-
          {
            "username": "",
            "email": "",
            "phone": "",
            "first_name": "",
            "last_name": "",
            "city_id": 0,
            "security_question": "",
            "security_answer": ""
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
