info:
  name: ValidateCart
  type: http
  seq: 30
  tags:
    - Shop

http:
  method: POST
  url: "{{baseUrl}}/shop/cart/validate"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "delivery_option_id": 0,
        "items": [
          {
            "product_id": 0,
            "quantity": 0,
            "selected_options": [
              {}
            ]
          }
        ],
        "order_type": "",
        "seller_company_id": 0
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/shop/cart/validate"
      method: POST
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "delivery_option_id": 0,
            "items": [
              {
                "product_id": 0,
                "quantity": 0,
                "selected_options": [
                  {}
                ]
              }
            ],
            "order_type": "",
            "seller_company_id": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "body": "",
            "error": false,
            "message": "",
            "message_user": "",
            "status": 0
          }

