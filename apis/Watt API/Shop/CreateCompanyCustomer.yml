info:
  name: CreateCompanyCustomer
  type: http
  seq: 2
  tags:
    - Shop

http:
  method: POST
  url: "{{baseUrl}}/companies/:company_id/customers"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "address": "",
        "buyer_company_id": 0,
        "buyer_profile_id": 0,
        "customer_type": "",
        "email": "",
        "full_name": "",
        "phone_number": ""
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
