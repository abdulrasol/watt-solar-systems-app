info:
  name: Promote user
  type: http
  seq: 2
  tags:
    - Users - Admin

http:
  method: POST
  url: "{{baseUrl}}/users/promote/:username"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: username
      value: ""
      type: path
      description: Username
  body:
    type: json
    data: |-
      {
        "promote": false,
        "user_id": 0
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/users/promote/:username"
      method: POST
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      params:
        - name: username
          value: ""
          type: path
          description: Username
      body:
        type: json
        data: |-
          {
            "promote": false,
            "user_id": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "body": "",
            "error": false,
            "message": "",
            "message_user": "",
            "status": 0
          }

