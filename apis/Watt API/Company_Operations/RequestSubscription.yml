  type: http
  seq: 16
  tags:
    - Company Operations

http:
  method: POST
  url: "{{baseUrl}}/companies/:company_id/subscription-request"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: company_id
      value: ""
      type: path
      description: company_id
  body:
    type: multipart-form
    data:
      - name: subscription_plan
        type: text
        value: ""
        description: Subscription Plan ID
      - name: notes
        type: text
        value: ""
        description: Notes
      - name: image
        type: file
        value: []
        description: Receipt / Image
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

