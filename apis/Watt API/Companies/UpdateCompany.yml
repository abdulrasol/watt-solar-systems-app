info:
  name: UpdateCompany
  type: http
  seq: 8
  tags:
    - Companies

http:
  method: PUT
  url: "{{baseUrl}}/companies/:company_id"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: company_id
      value: ""
      type: path
      description: company_id
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: ""
        description: Name
      - name: company_type
        type: text
        value: ""
        description: Company Type ID
      - name: description
        type: text
        value: ""
        description: Description
      - name: address
        type: text
        value: ""
        description: Address
      - name: phone
        type: text
        value: ""
        description: Phone
      - name: allows_b2b
        type: text
        value: ""
        description: Allows B2B
      - name: allows_b2c
        type: text
        value: ""
        description: Allows B2C
      - name: city
        type: text
        value: ""
        description: City ID
      - name: currency
        type: text
        value: ""
        description: Currency ID
      - name: image
        type: file
        value: []
        description: Logo
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

