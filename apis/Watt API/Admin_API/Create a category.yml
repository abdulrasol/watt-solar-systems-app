info:
  name: Create a category
  type: http
  seq: 2
  tags:
    - Admin API

http:
  method: POST
  url: "{{baseUrl}}/admin/categories"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: ""
        description: Category name
      - name: icon
        type: file
        value: []
        description: Category icon
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/admin/categories"
      method: POST
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      body:
        type: multipart-form
        data:
          - name: name
            type: text
            value: ""
            description: Category name
          - name: icon
            type: file
            value: []
            description: Category icon
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""

docs: Creates a new global category with optional icon
