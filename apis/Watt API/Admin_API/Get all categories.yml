info:
  name: Get all categories
  type: http
  seq: 1
  tags:
    - Admin API

http:
  method: GET
  url: "{{baseUrl}}/admin/categories"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/admin/categories"
      method: GET
      headers:
        - name: Authorization
          value: "{{apiKey}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""

docs: Retrieves all global categories
