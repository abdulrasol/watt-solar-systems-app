info:
  name: Create a subscription
  type: http
  seq: 20
  tags:
    - Admin API

http:
  method: POST
  url: "{{baseUrl}}/admin/subscriptions"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "description": "test",
        "duration_days": 10,
        "is_active": true,
        "name": "test 10 days",
        "price": 0,
        "features": {
              "disabled": [
                "accounting"
                // "store",
                // "offers",
                // "contacts",
                // "ads"
              ]
            }
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/admin/subscriptions"
      method: POST
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "description": "",
            "duration_days": 0,
            "is_active": false,
            "name": "",
            "price": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""

docs: Creates a new subscription plan
