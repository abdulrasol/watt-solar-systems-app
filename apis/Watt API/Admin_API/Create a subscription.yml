info:
  name: Create a subscription
  type: http
  seq: 20
  tags:
    - Admin API

http:
  method: POST
  url: "{{baseUrl}}/admin/subscriptions"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "description": "",
        "duration_days": 0,
        "is_active": false,
        "name": "",
        "price": 0
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/admin/subscriptions"
      method: POST
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "description": "",
            "duration_days": 0,
            "is_active": false,
            "name": "",
            "price": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""

docs: Creates a new subscription plan
