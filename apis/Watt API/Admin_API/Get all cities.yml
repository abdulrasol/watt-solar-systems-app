  tags:
    - Admin API

http:
  method: GET
  url: "{{baseUrl}}/admin/cities"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: country_id
      value: ""
      type: query
      description: Filter by Country ID
      disabled: true
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
