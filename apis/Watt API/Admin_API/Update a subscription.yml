info:
  name: Update a subscription
  type: http
  seq: 21
  tags:
    - Admin API

http:
  method: PUT
  url: "{{baseUrl}}/admin/subscriptions/:id"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: id
      value: ""
      type: path
      description: Subscription ID
  body:
    type: json
    data: |-
      {
        "description": "",
        "duration_days": 0,
        "is_active": false,
        "name": "",
        "price": 0,
        "features": {
              "disabled": [
                "accounting"
                // "store",
                // "offers",
                // "contacts",
                // "ads"
              ]
            }
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/admin/subscriptions/:id"
      method: PUT
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      params:
        - name: id
          value: ""
          type: path
          description: Subscription ID
      body:
        type: json
        data: |-
          {
            "description": "",
            "duration_days": 0,
            "is_active": false,
            "name": "",
            "price": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""

docs: Updates an existing subscription plan by ID
