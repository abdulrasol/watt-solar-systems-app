info:
  name: Update a category
  type: http
  seq: 3
  tags:
    - Admin API

http:
  method: PUT
  url: "{{baseUrl}}/admin/categories/:id"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: id
      value: ""
      type: path
      description: Category ID
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: ""
        description: Category name
      - name: icon
        type: file
        value: []
        description: Category icon
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/admin/categories/:id"
      method: PUT
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      params:
        - name: id
          value: ""
          type: path
          description: Category ID
      body:
        type: multipart-form
        data:
          - name: name
            type: text
            value: ""
            description: Category name
          - name: icon
            type: file
            value: []
            description: Category icon
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""

docs: Updates an existing global category by ID with optional icon
