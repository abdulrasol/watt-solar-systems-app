info:
  name: Update a city
  type: http
  seq: 23
  tags:
    - Admin API

http:
  method: PUT
  url: "{{baseUrl}}/api/admin/cities/:id"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: id
      value: ""
      type: path
      description: City ID
  body:
    type: json
    data: |-
      {
        "code": "",
        "country_id": 0,
        "name": ""
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/admin/cities/:id"
      method: PUT
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      params:
        - name: id
          value: ""
          type: path
          description: City ID
      body:
        type: json
        data: |-
          {
            "code": "",
            "country_id": 0,
            "name": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""

