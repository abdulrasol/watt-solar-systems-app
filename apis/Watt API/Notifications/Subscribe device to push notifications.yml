info:
  name: Subscribe device to push notifications
  type: http
  seq: 6
  tags:
    - Notifications

http:
  method: POST
  url: "{{baseUrl}}/api/v1/notification/subscribe"
  body:
    type: json
    data: |-
      {
        "app_version": "",
        "device_id": "",
        "platform": "",
        "token": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

