info:
  name: Deactivate a specific device token
  type: http
  seq: 7
  tags:
    - Notifications

http:
  method: POST
  url: "{{baseUrl}}/api/v1/notification/tokens/:token_id/deactivate"
  params:
    - name: token_id
      value: ""
      type: path
      description: Device Token ID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

