info:
  name: List active push devices
  type: http
  seq: 1
  tags:
    - Notifications

http:
  method: GET
  url: "{{baseUrl}}/api/v1/notification/devices"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/notification/devices"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v1/notification/devices"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "body": "",
            "error": false,
            "message": "",
            "message_user": "",
            "status": 0
          }

docs: Get a list of registered push notification devices for the user
