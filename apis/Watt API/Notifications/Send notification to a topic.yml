info:
  name: Send notification to a topic
  type: http
  seq: 4
  tags:
    - Notifications

http:
  method: POST
  url: "{{baseUrl}}/api/v1/notification/send-topic/:topic"
  params:
    - name: topic
      value: ""
      type: path
      description: Topic Name
  body:
    type: json
    data: |-
      {
        "body": "",
        "data": {},
        "title": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

