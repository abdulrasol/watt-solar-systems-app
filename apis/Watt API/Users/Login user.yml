info:
  name: Login user
  type: http
  seq: 3
  tags:
    - Users

http:
  method: POST
  url: "{{baseUrl}}/users/login"
  body:
    type: json
    data: |-
      {
        "password": "admin",
        "username": "admin"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/users/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "password": "",
            "username": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "body": "",
            "error": false,
            "message": "",
            "message_user": "",
            "status": 0
          }
