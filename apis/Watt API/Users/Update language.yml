info:
  name: Update language
  type: http
  seq: 2
  tags:
    - Users

http:
  method: PUT
  url: "{{baseUrl}}/users/language"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "language": ""
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/users/language"
      method: PUT
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "language": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "body": "",
            "error": false,
            "message": "",
            "message_user": "",
            "status": 0
          }

docs: Updates the user's language setting
