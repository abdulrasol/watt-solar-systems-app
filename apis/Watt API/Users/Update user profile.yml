info:
  name: Update user profile
  type: http
  seq: 8
  tags:
    - Users

http:
  method: PUT
  url: "{{baseUrl}}/users/profile"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  body:
    type: multipart-form
    data:
      - name: username
        type: text
        value: ""
        description: Username
      - name: first_name
        type: text
        value: ""
        description: First Name
      - name: last_name
        type: text
        value: ""
        description: Last Name
      - name: email
        type: text
        value: ""
        description: Email
      - name: phone
        type: text
        value: ""
        description: Phone
      - name: city_id
        type: text
        value: ""
        description: City ID
      - name: security_question
        type: text
        value: ""
        description: Security Question
      - name: security_answer
        type: text
        value: ""
        description: Security Answer
      - name: image
        type: file
        value: []
        description: Profile Image
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

