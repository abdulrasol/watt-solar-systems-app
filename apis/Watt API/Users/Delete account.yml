info:
  name: Delete account
  type: http
  seq: 1
  tags:
    - Users

http:
  method: POST
  url: "{{baseUrl}}/users/delete-account"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "password": "",
        "reason": ""
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/users/delete-account"
