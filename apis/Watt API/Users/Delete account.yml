        type: json
        data: |-
          {
            "password": "",
            "reason": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "body": "",
            "error": false,
            "message": "",
            "message_user": "",
            "status": 0
          }

