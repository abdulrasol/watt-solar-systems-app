info:
  name: Get user profile
  type: http
  seq: 7
  tags:
    - Users

http:
  method: GET
  url: "{{baseUrl}}/users/profile"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/users/profile"
      method: GET
      headers:
        - name: Authorization
          value: "{{apiKey}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "body": "",
            "error": false,
            "message": "",
            "message_user": "",
            "status": 0
          }
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/users/profile"
      method: GET
      headers:
        - name: Authorization
          value: "{{apiKey}}"
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "body": "",
            "error": false,
            "message": "",
            "message_user": "",
            "status": 0
          }
  - name: 404 Response
    description: Not Found
    request:
      url: "{{baseUrl}}/users/profile"
      method: GET
      headers:
        - name: Authorization
          value: "{{apiKey}}"
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "body": "",
            "error": false,
            "message": "",
            "message_user": "",
            "status": 0
          }

docs: Retrieves the authenticated user's profile
